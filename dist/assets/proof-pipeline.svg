<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 295" role="img" aria-labelledby="t d"><title id="t">A certificate crosses the trust boundary</title><desc id="d">Data and proposed claims enter search, which produces a certificate. A verified checker accepts evidence under formal semantics. Storage adapters are independent of this proof pipeline.</desc><rect width="1050" height="295" fill="#f5f0e6"/><g font-family="monospace" font-size="13" text-anchor="middle" fill="#24241f"><rect x="20" y="90" width="215" height="100" fill="none" stroke="#24241f" stroke-width="2"/><text x="127" y="130">DATA + CLAIM</text><text x="127" y="158" font-size="10">RDF graph / query</text><path d="M244 140h30m-8-6 8 6-8 6" fill="none" stroke="#24241f"/><rect x="285" y="90" width="215" height="100" fill="none" stroke="#24241f" stroke-width="2"/><text x="392" y="130">SEARCH</text><text x="392" y="158" font-size="10">Elpi / other producer</text><path d="M509 140h30m-8-6 8 6-8 6" fill="none" stroke="#24241f"/><rect x="550" y="90" width="215" height="100" fill="none" stroke="#24241f" stroke-width="2"/><text x="657" y="130">CERTIFICATE</text><text x="657" y="158" font-size="10">Derivation DAG</text><path d="M774 140h30m-8-6 8 6-8 6" fill="none" stroke="#24241f"/><rect x="815" y="90" width="215" height="100" fill="none" stroke="#d74220" stroke-width="2"/><text x="922" y="130">CHECK</text><text x="922" y="158" font-size="10">Verified Lean checker</text><path d="M790 55V230" stroke="#d74220" stroke-dasharray="5 5"/><text x="790" y="35" fill="#d74220" font-size="11">TRUST BOUNDARY</text><text x="420" y="230" font-size="11">SEARCH MAY BE WRONG. EVIDENCE MUST CHECK.</text><text x="922" y="230" font-size="11">ENTAILMENT</text><text x="525" y="276" font-size="10">Guarantees depend on the formal model, axioms, inputs, and execution path.</text></g></svg>